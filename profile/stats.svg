<svg width="450" height="195" viewBox="0 0 450 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
  <title id="titleId">NanoDev's GitHub Stats</title>
  <desc id="descId">GitHub Stats for NanoDev</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #fe428e;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #a9fef7;
    }
    @supports(-moz-appearance: auto) {
      .stat { font-size: 12px; }
    }
    .bold { font-weight: 700 }
    .icon {
      fill: #f8d847;
      display: block;
    }
    .rank-text {
      font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fe428e;
      animation: scaleInAnimation 0.3s ease-in-out forwards;
    }
    .rank-percentile-header {
      font: 500 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9fef7;
    }
    .rank-circle-rim {
      stroke: #2c5364;
      fill: none;
      stroke-width: 6;
      opacity: 0.4;
    }
    .rank-circle {
      stroke: #fe428e;
      stroke-dasharray: 250;
      stroke-dashoffset: 40;
      stroke-width: 6;
      stroke-linecap: round;
      fill: none;
      animation: rankAnimation 1s forwards ease-in-out;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleInAnimation {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
  </style>
  <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="449" fill="#141321" stroke-opacity="0"/>
  
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">NanoDev's GitHub Stats</text>
  </g>

  <g transform="translate(0, 55)">
    <!-- Stars -->
    <g transform="translate(25, 0)">
      <svg class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
        <path fill="#f8d847" fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Total Stars Earned:</text>
      <text class="stat bold" x="200" y="12.5" fill="#fe428e">31</text>
    </g>

    <!-- Commits -->
    <g transform="translate(25, 25)">
      <svg class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
        <path fill="#f8d847" fill-rule="evenodd" d="M10.5 7.75a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zm1.43.75a4.002 4.002 0 01-7.86 0H.75a.75.75 0 110-1.5h3.32a4.002 4.002 0 017.86 0h3.32a.75.75 0 110 1.5h-3.32z"/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Total Commits:</text>
      <text class="stat bold" x="200" y="12.5" fill="#fe428e">225</text>
    </g>

    <!-- PRs -->
    <g transform="translate(25, 50)">
      <svg class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
        <path fill="#f8d847" fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Total PRs:</text>
      <text class="stat bold" x="200" y="12.5" fill="#fe428e">1</text>
    </g>

    <!-- Issues -->
    <g transform="translate(25, 75)">
      <svg class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
        <path fill="#f8d847" fill-rule="evenodd" d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9 3a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.25a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0v-3.5z"/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Total Issues:</text>
      <text class="stat bold" x="200" y="12.5" fill="#fe428e">1</text>
    </g>

    <!-- Contributed to -->
    <g transform="translate(25, 100)">
      <svg class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
        <path fill="#f8d847" fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Contributed to:</text>
      <text class="stat bold" x="200" y="12.5" fill="#fe428e">3</text>
    </g>

    <!-- Rank circle -->
    <g transform="translate(365, 55)">
      <circle class="rank-circle-rim" cx="-10" cy="-10" r="40"/>
      <circle class="rank-circle" cx="-10" cy="-10" r="40"/>
      <text class="rank-text" x="-10" y="-3" text-anchor="middle" dominant-baseline="central">A+</text>
    </g>
  </g>
</svg>
